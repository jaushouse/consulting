baseURL = 'https://jaushouse.com/'
languageCode = 'en-us'
title = 'JausHouse'

[params]
  author = 'Brandon Jaus'
  description = 'Software consulting for small businesses. We help you replace spreadsheets, manual processes, and disconnected tools with software that actually works together.'
  email = 'brandon@jaushouse.com'
  # Cal.com booking URL
  calURL = 'https://cal.com/jaushouse/discovery'
  # Cloudflare Web Analytics — add your token after setup
  # cfAnalyticsToken = ''
  # Cloudflare Turnstile site key (set secret key in CF Pages env as TURNSTILE_SECRET_KEY)
  turnstileSiteKey = '0x4AAAAAAC3mO4DfnEgR83Ga'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[markup]
  [markup.highlight]
    style = 'monokai'
    lineNos = true
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 100

[menus]
  [[menus.main]]
    name = 'Services'
    url = '/services/'
    weight = 10
  [[menus.main]]
    name = 'Process'
    url = '/process/'
    weight = 20
  [[menus.main]]
    name = 'Resources'
    url = '/resources/'
    weight = 30
  [[menus.main]]
    name = 'About'
    url = '/about/'
    weight = 40
  [[menus.main]]
    name = 'Contact'
    url = '/contact/'
    weight = 50

[outputs]
  home = ['HTML']

[sitemap]
  changeFreq = 'weekly'
  priority = 0.5
